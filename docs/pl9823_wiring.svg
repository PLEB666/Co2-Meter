<svg viewBox="0 20 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wiring of the PL9823-F8 LED to the ESP32" font-family="Segoe UI, system-ui, sans-serif">
      <!-- ESP32 -->
      <rect x="20" y="30" width="174" height="170" rx="8" fill="#e7f5ee" stroke="#1a7f37" stroke-width="1.5"/>
      <g text-anchor="middle">
        <text x="107" y="54" font-size="12" font-weight="700" fill="#1f2328">ESP32-C6</text>
        <text x="107" y="69" font-size="10.5" fill="#57606a">Waveshare DEV-KIT-N16</text>
      </g>
      <g font-size="10.5" fill="#1f2328" text-anchor="end">
        <text x="180" y="109"><tspan font-weight="700">GPIO18</tspan><tspan fill="#57606a"> J3-7</tspan></text>
        <text x="180" y="139"><tspan font-weight="700">5V</tspan><tspan fill="#57606a"> J1-3</tspan></text>
        <text x="180" y="169"><tspan font-weight="700">GND</tspan><tspan fill="#57606a"> J3-5</tspan></text>
      </g>
      <g fill="#22272e">
        <rect x="186" y="101" width="8" height="8" rx="1"/>
        <rect x="186" y="131" width="8" height="8" rx="1"/>
        <rect x="186" y="161" width="8" height="8" rx="1"/>
      </g>
      <!-- wires -->
      <g stroke-width="3" stroke-linecap="round" fill="none">
        <line x1="194" y1="105" x2="390" y2="105" stroke="#1e63d6"/>
        <line x1="194" y1="135" x2="372" y2="135" stroke="#d32f2f"/>
        <line x1="194" y1="165" x2="330" y2="165" stroke="#24292f"/>
      </g>
      <g font-size="10" fill="#57606a" text-anchor="middle">
        <text x="262" y="99">3.3 V data</text>
        <text x="262" y="129">5 V</text>
      </g>
      <!-- legs, lengths as in the PL9823-F8 drawing: DIN shortest, GND longest -->
      <g stroke="#8c959f" stroke-width="3" stroke-linecap="round">
        <line x1="390" y1="105" x2="482" y2="105"/>
        <line x1="372" y1="135" x2="482" y2="135"/>
        <line x1="330" y1="165" x2="482" y2="165"/>
        <line x1="352" y1="195" x2="482" y2="195"/>
      </g>
      <circle cx="390" cy="105" r="4" fill="#1e63d6"/>
      <circle cx="372" cy="135" r="4" fill="#d32f2f"/>
      <circle cx="330" cy="165" r="4" fill="#24292f"/>
      <g font-size="10" fill="#1f2328">
        <text x="398" y="99"><tspan fill="#57606a">1</tspan> <tspan font-weight="700">DIN</tspan> (shortest)</text>
        <text x="398" y="129"><tspan fill="#57606a">2</tspan> <tspan font-weight="700">VDD</tspan></text>
        <text x="398" y="159"><tspan fill="#57606a">3</tspan> <tspan font-weight="700">GND</tspan> (longest)</text>
        <text x="398" y="189"><tspan fill="#57606a">4</tspan> <tspan font-weight="700">DOUT</tspan></text>
      </g>
      <text x="344" y="199" text-anchor="end" font-size="10" fill="#57606a">not connected</text>
      <!-- the LED lying on its side, dome to the right; the rim is cut flat on the DOUT side -->
      <rect x="480" y="76" width="10" height="140" rx="2" fill="#eef1f5" stroke="#8c959f" stroke-width="1.5"/>
      <path d="M490,84 H588 A66,66 0 0 1 588,216 H490 Z" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
      <line x1="479" y1="216" x2="491" y2="216" stroke="#1f2328" stroke-width="2.5"/>
      <text x="485" y="232" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2328">flat</text>
      <g text-anchor="middle">
        <text x="560" y="146" font-size="12" font-weight="700" fill="#1f2328">PL9823-F8</text>
        <text x="560" y="162" font-size="10" fill="#57606a">8 mm, diffused</text>
      </g>
      <!-- the LED seen from the legs, same way round as above -->
      <text x="515" y="262" text-anchor="end" font-size="10.5" font-weight="700" fill="#1f2328">seen from the legs</text>
      <path d="M545.9,326 A40,40 0 1 1 588.1,326 Z" fill="#eef1f5" stroke="#8c959f" stroke-width="1.5"/>
      <line x1="545.9" y1="326" x2="588.1" y2="326" stroke="#1f2328" stroke-width="2.5"/>
      <g stroke="#8c959f" stroke-width="1">
        <line x1="571" y1="271" x2="615" y2="271"/>
        <line x1="571" y1="285" x2="615" y2="285"/>
        <line x1="571" y1="299" x2="615" y2="299"/>
        <line x1="571" y1="313" x2="615" y2="313"/>
      </g>
      <g fill="#8c959f" stroke="#57606a" stroke-width="1">
        <circle cx="567" cy="271" r="3.5"/>
        <circle cx="567" cy="285" r="3.5"/>
        <circle cx="567" cy="299" r="3.5"/>
        <circle cx="567" cy="313" r="3.5"/>
      </g>
      <g font-size="10" fill="#1f2328">
        <text x="620" y="274.5"><tspan fill="#57606a">1</tspan> <tspan font-weight="700">DIN</tspan></text>
        <text x="620" y="288.5"><tspan fill="#57606a">2</tspan> <tspan font-weight="700">VDD</tspan></text>
        <text x="620" y="302.5"><tspan fill="#57606a">3</tspan> <tspan font-weight="700">GND</tspan></text>
        <text x="620" y="316.5"><tspan fill="#57606a">4</tspan> <tspan font-weight="700">DOUT</tspan></text>
      </g>
      <text x="567" y="343" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2328">flat side</text>
      <!-- how to find the legs -->
      <g font-size="10.5" fill="#1f2328">
        <text x="20" y="262" font-weight="700">Which way round</text>
        <text x="20" y="280">The rim has a flat side next to DOUT.</text>
        <text x="20" y="296">GND is the longest leg, DIN the shortest.</text>
        <text x="20" y="312">From the flat side: DOUT, GND, VDD, DIN.</text>
      </g>
</svg>
